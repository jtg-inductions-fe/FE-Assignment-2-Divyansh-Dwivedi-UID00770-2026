<app-user-profile></app-user-profile>

<div class="loading">
  @if (isLoading) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    <h1>Loading Articles...</h1>
  }
</div>

<a (click)="goBack()" (keydown.enter)="goBack()" tabindex="0" class="my-articles__back-link">
  <mat-icon>arrow_back</mat-icon>
  <span>Back</span>
</a>

<div class="article-grid">
  @for (article of articles; track article) {
    <div class="card-container">
      <app-article-card
        [article]="article"
        [showActions]="true"
        (update)="updateArticle(article.id)"
        (delete)="deleteCurrentArticle(article.id)"
        [routerLink]="[APP_ROUTES.DASHBOARD.ARTICLE, article.id]"
      >
      </app-article-card>
    </div>
  }
</div>
