<app-user-profile></app-user-profile>

<div>
  @if (isLoading) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }
</div>

<div class="article-grid">
  @for (article of articles; track article) {
    <div class="card-container">
      <app-article-card
        [article]="article"
        [routerLink]="[APP_ROUTES.DASHBOARD.ARTICLE, article.id]"
      >
      </app-article-card>
      <div class="card-actions">
        <a mat-button color="primary" (click)="updateArticle(article.id)">
          <mat-icon>edit</mat-icon> Update
        </a>
        <button
          mat-button
          color="warn"
          class="card-actions__delete"
          (click)="deleteCurrentArticle(article.id)"
        >
          <mat-icon>delete</mat-icon> Delete
        </button>
      </div>
    </div>
  }
</div>
