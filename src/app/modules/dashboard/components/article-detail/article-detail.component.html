<app-user-profile></app-user-profile>

<div class="loading">
  @if (isLoading) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    <h1>Loading Article...</h1>
  }
</div>

@if (article) {
  <div class="article-detail">
    <button mat-button (click)="goBack()" class="article-detail__back-button">
      <mat-icon>arrow_back</mat-icon>
      <span>Back</span>
    </button>

    <h1 class="article-detail__title">
      {{ article.title }}
    </h1>

    <p class="article-detail__meta">By {{ article.author }} - {{ article.createdAt | date }}</p>

    @if (article.image) {
      <img class="article-detail__image" [src]="article.image" alt="article image" />
    }

    <div class="article-detail__content">
      <p class="article-detail__description">
        {{ article.description }}
      </p>
    </div>

    <div>
      <mat-chip-set>
        @for (tag of article.tags; track tag) {
          <mat-chip>
            {{ tag }}
          </mat-chip>
        }
      </mat-chip-set>
    </div>
  </div>
}
