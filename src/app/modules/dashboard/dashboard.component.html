<app-user-profile></app-user-profile>

<div>
  @if (isLoading) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }
</div>

<div class="article-grid">
  @for (article of articles; track article.id) {
    <app-article-card [article]="article" [routerLink]="[APP_ROUTES.DASHBOARD.ARTICLE, article.id]">
    </app-article-card>
  }
</div>

<mat-paginator
  class="pagination"
  [disabled]="isLoading"
  [length]="totalItems"
  [pageSize]="pageSize"
  [pageSizeOptions]="[8, 12]"
  (page)="onPageChange($event)"
>
</mat-paginator>
