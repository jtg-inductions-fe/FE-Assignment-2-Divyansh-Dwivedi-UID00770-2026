<app-user-profile></app-user-profile>

<div class="loading">
  @if (isLoading) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    <h1>Loading Articles...</h1>
  }
</div>

<div class="search-filter-wrapper">
  <app-search-bar
    class="search-filter-wrapper__bar"
    (searchBar)="onSearch($event)"
  ></app-search-bar>
  <button
    mat-stroked-button
    class="search-filter-wrapper__button"
    (click)="openFilterDrawer()"
    [class.active]="hasActiveFilters"
    aria-label="Open filter options"
  >
    <mat-icon>tune</mat-icon>
    <span>Filters</span>
  </button>
</div>

<div class="page-container">
  <div class="article-grid">
    @for (article of articles; track article.id) {
      <app-article-card
        [article]="article"
        [routerLink]="[APP_ROUTES.DASHBOARD.ARTICLE, article.id]"
      >
      </app-article-card>
    }
  </div>

  <mat-paginator
    class="pagination"
    [disabled]="isLoading"
    [length]="totalItems"
    [pageSize]="defaultPageSize"
    [pageSizeOptions]="pageSizeOptions"
    (page)="onPageChange($event)"
  >
  </mat-paginator>
</div>

<app-side-drawer
  [isOpen]="isFilterDrawerOpen"
  [currentTag]="tagFilter"
  [currentAuthor]="authorFilter"
  (closeDrawer)="closeFilterDrawer()"
  (applyFilters)="onApplyFilters($event)"
  (resetFilters)="onResetFilters()"
></app-side-drawer>
