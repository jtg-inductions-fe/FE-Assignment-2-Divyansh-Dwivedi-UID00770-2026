<div class="error-page">
  <div class="error-page__container">
    <h1 class="error-page__title">404</h1>
    <h2 class="error-page__subtitle">Page Not Found</h2>
    <p class="error-page__description">
      Oops! The page you are looking for doesn't exist, has been removed, or is temporarily
      unavailable.
    </p>
    <div class="error-page__actions">
      <a mat-button color="primary" [routerLink]="APP_ROUTES.AUTH.LOGIN"> Go to Home </a>
    </div>
  </div>
</div>
